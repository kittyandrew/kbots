name: ci

# Quality gates run on PRs and main pushes. Nix package and image builds run only on main pushes,
# after quality passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality checks
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - name: GitHub Actions lint (actionlint)
        run: nix develop --command actionlint

      - name: GitHub Actions security audit (zizmor)
        run: nix develop --command zizmor .github/workflows

      - name: uv lock freshness
        run: nix develop --command uv lock --check

      - name: uv workspace sync
        run: nix develop --command uv sync --frozen --all-packages

      - name: Nix format (alejandra)
        run: nix develop --command alejandra -c .

      - name: Nix lint (deadnix)
        run: nix develop --command deadnix --fail flake.nix nix/shared/default.nix

      - name: Flake check
        run: nix flake check --all-systems

      - name: Python format (ruff)
        run: nix develop --command ruff format --check admin common pes

      - name: Python lint (ruff)
        run: nix develop --command ruff check admin common pes

      - name: Python types (mypy)
        run: nix develop --command uv run mypy admin/src common/src pes/src

  nix:
    name: nix build
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - name: Build packages
        run: nix build .#admin .#pes --no-link

      - name: Build Docker images
        run: nix build .#admin-image .#pes-image --no-link
