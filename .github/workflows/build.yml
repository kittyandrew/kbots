name: build

# Master-branch only: full Nix pipeline plus Attic cache push. Quality gates
# run in a separate token-free job first; the Attic push token is only exposed
# after those gates pass.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - name: GitHub Actions lint (actionlint)
        run: nix shell nixpkgs#actionlint -c actionlint

      - name: GitHub Actions security audit (zizmor)
        run: nix shell nixpkgs#zizmor -c zizmor .github/workflows

      - name: Poetry metadata
        run: nix develop --command poetry check

      - name: Nix format (alejandra)
        run: nix develop --command alejandra -c .

      - name: Nix lint (deadnix)
        run: nix shell nixpkgs#deadnix -c deadnix --no-lambda-arg flake.nix default.nix

      - name: Python format (ruff)
        run: nix develop --command ruff format --check src

      - name: Python lint (ruff)
        run: nix develop --command ruff check src

      - name: Python types (mypy)
        run: nix develop --command mypy src

  nix:
    name: nix check + build + push
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3

      - name: Setup Attic cache
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a
        with:
          endpoint: ${{ vars.ATTIC_ENDPOINT }}
          cache: general
          token: ${{ secrets.ATTIC_GENERAL_PUSH_TOKEN }}

      - name: Flake check
        run: nix flake check --all-systems

      - name: Build package
        run: nix build .#vtraty-pes-bot

      - name: Build Docker image
        run: nix build .#docker-image
