[tool.uv.workspace]
members = ["admin", "common", "pes"]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.15",
]

[tool.ruff]
line-length = 131
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
# mypy cannot follow the editable installs' import hooks, and the flattened */src layout hides package names, so
# each workspace package is a symlink here (`mypy -p <name>`). Without it, cross-package imports silently become Any.
mypy_path = "$MYPY_CONFIG_FILE_DIR/.mypy-path"
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["kbots_common", "kbots_common.*", "vtraty_admin_bot", "vtraty_admin_bot.*", "vtraty_pes_bot", "vtraty_pes_bot.*"]
ignore_missing_imports = false  # a broken .mypy-path link must fail the gate, not turn back into Any
