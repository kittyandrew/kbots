[tool.uv.workspace]
members = ["admin", "common", "pes"]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.15",
]

[tool.ruff]
line-length = 131
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
