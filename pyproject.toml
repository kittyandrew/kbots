[project]
name = "vtraty-pes-bot"
version = "0.1.0"
description = "Vtraty utility bot"
authors = [
    {name = "kittyandrew",email = "alias.dev@kittymail.me"}
]
readme = ".github/README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "telethon-tgcrypto==0.0.3",
    "telethon==1.43.2",
    "aiofiles==25.1.0",
    "aiohttp>=3.13.5,<4.0.0",
    "yt-dlp>=2026.3.17,<2027.0.0",
    "bgutil-ytdlp-pot-provider==1.3.1",
    "numpy>=2.4.6,<3.0.0",
    "opencv-python>=4.13.0.92,<5.0.0.0",
    "pytz==2026.2",
    "cachetools==7.1.3",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai==1.2.1",
    "pydantic>=2.13.4,<3.0.0",
    "imgkit==1.2.3",
    "jinja2>=3.1.6,<4.0.0",
    "markupsafe>=3.0.3,<4.0.0",
    "aiocache==0.12.3",
    "sentry-sdk>=2.60.0,<3.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
vtraty-pes-bot = "vtraty_pes_bot:main_cli"

[tool.ruff]
line-length = 131
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
